function cultureScore(){
 const totals={literary:0,sports:0,honor:0,media:0},unawarded={literary:0,sports:0},seen=new Map();
 for(const x of current().records){
  if(x.kind!=='culture'||!x.eligible||!totals.hasOwnProperty(x.section)||!x.name?.trim())continue;
  const spec=cultureCatalog[x.section]?.[Number(x.option)];
  const points=x.event==='legacy'?safe(x.points,30):(spec?.[1]||0);
  const unawardedFlag=x.event!=='legacy'&&!!spec?.[2];
  const key=x.section+':'+x.name.trim().toLocaleLowerCase();
  const prior=seen.get(key);
  if(prior&&prior.points>=points)continue;
  seen.set(key,{section:x.section,points,unawarded:unawardedFlag});
 }
 for(const x of seen.values()){
  if(x.unawarded)unawarded[x.section]+=x.points;
  else totals[x.section]+=x.points;
 }
 for(const part of ['literary','sports'])totals[part]+=Math.min(1.5,unawarded[part]);
 totals.honor=Math.min(3,totals.honor);totals.media=Math.min(3,totals.media);
 return totals;
}

function configText(){return JSON.stringify(items().map(({name,max,details})=>({name,max,details})),null,2);}
$('preset').addEventListener('change',e=>{state.preset=e.target.value;selected=0;tab='paper';render();});
$('reset').addEventListener('click',()=>{if(!confirm('清空当前模板的全部记录和分数？其他模板不受影响。'))return;state.byPreset[state.preset]=blank();selected=0;render();});
$('showConfig').addEventListener('click',()=>{$('config').value=configText();$('message').textContent='已显示当前配置。';});
$('applyConfig').addEventListener('click',()=>{
 try{
  const input=JSON.parse($('config').value);
  if(!Array.isArray(input)||!input.length||input.length>20)throw Error('请输入1—20个项目的数组。');
  const arr=input.map((x,i)=>{const max=Number(x.max);if(!x||typeof x.name!=='string'||!x.name.trim()||!Number.isFinite(max)||max<=0)throw Error('第'+(i+1)+'项名称或上限无效。');return {key:'custom'+i,name:x.name.trim(),max,kind:'manual',details:Array.isArray(x.details)?x.details.map(String):[]};});
  current().custom=arr;selected=0;render();$('message').textContent='已应用，总上限 '+money(arr.reduce((s,x)=>s+x.max,0))+' 分。';
 }catch(e){$('message').textContent='无法应用：'+e.message;}
});
$('backup').addEventListener('click',()=>{
 const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob),a=E('a',{href:url,download:'石工院综测数据备份.json'},document.body);
 a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);
});
$('restore').addEventListener('change',async e=>{
 const f=e.target.files?.[0];if(!f)return;
 try{const v=JSON.parse(await f.text());if(v.version!==2||!v.byPreset||!presets[v.preset])throw Error('不是此版本导出的备份');state=v;migrateState(state);$('preset').value=v.preset;selected=0;render();alert('备份导入成功。');}
 catch(err){alert('无法导入：'+err.message);}finally{e.target.value='';}
});
load();
</script></body></html>
